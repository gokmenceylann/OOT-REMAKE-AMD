name: "Feature request"
description: "Suggest an improvement"
body:
  - type: textarea
    id: field-1
    attributes:
      label: "Problem"
      description: "Describe the workflow and where it breaks down."
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: "Expected outcome"
      description: "Describe the requested behavior and how it could be tested."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Attachments
      options:
        - label: My attachments exclude game data, keys, personal paths, saves and SDK binaries.
          required: true
